name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  # Initial line-coverage threshold for the production code under test (Andy.Model).
  # Raise this over time; it must not regress. See README "Development" for context.
  COVERAGE_THRESHOLD: '0.75'

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Verify formatting
      if: matrix.os == 'ubuntu-latest'
      run: dotnet format --verify-no-changes

    - name: Test (non-Linux)
      if: matrix.os != 'ubuntu-latest'
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Test with coverage (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: >
        dotnet test --configuration Release --no-build --verbosity normal
        --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Enforce coverage threshold
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        file=$(find ./TestResults -name coverage.cobertura.xml | head -1)
        if [ -z "$file" ]; then echo "No coverage report found"; exit 1; fi
        rate=$(grep -o 'line-rate="[0-9.]*"' "$file" | head -1 | grep -o '[0-9.]*')
        echo "Line coverage: $(python3 -c "print(f'{float('$rate')*100:.1f}%')") (threshold $(python3 -c "print(f'{float('${{ env.COVERAGE_THRESHOLD }}')*100:.0f}%')"))"
        python3 -c "import sys; sys.exit(0 if float('$rate') >= float('${{ env.COVERAGE_THRESHOLD }}') else 1)"

    - name: Upload coverage report
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ./TestResults/**/coverage.cobertura.xml
        if-no-files-found: warn
